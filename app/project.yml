name: TVScores
options:
  bundleIdPrefix: com.julienmalige
  developmentLanguage: en
  deploymentTarget:
    tvOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    # Simulator builds in CI have no team and need no signature. Release is
    # left alone so the archive can sign automatically with the team passed
    # on the xcodebuild command line.
    Debug:
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGN_IDENTITY: ""
targets:
  TVScores:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: TV Scores
        CFBundleName: TV Scores
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, fr, pt, es]
        TVScoresProxyURL: https://srv1822832.tailf78112.ts.net/tvscores
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julienmalige.tvscores
        TARGETED_DEVICE_FAMILY: "3"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
  # Unit tests run inside the app, so they see its bundle — the sample JSON
  # and the string catalogue — and its internals through @testable.
  TVScoresTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: Tests/Unit
    dependencies:
      - target: TVScores
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.julienmalige.tvscores.tests
  # Flow tests drive the app from outside with the Siri Remote, one per screen.
  TVScoresFlows:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: Tests/Flows
    dependencies:
      - target: TVScores
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.julienmalige.tvscores.flows
schemes:
  TVScores:
    build:
      targets:
        TVScores: all
        TVScoresTests: [test]
        TVScoresFlows: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TVScoresTests
        - TVScoresFlows
