name: TVScores
options:
  bundleIdPrefix: com.julienmalige
  developmentLanguage: en
  deploymentTarget:
    tvOS: "18.0"
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    # Amplitude, for the usage figures the viewer agrees to share
    # (docs/analytics.md). The key is public, as in every app that uses
    # Amplitude: it only lets an app send events. The zone is the data
    # centre the project was made in, US or EU; a new project means a new key.
    AMPLITUDE_KEY: fa0da7c87bc2db2ac8e848cf0daab10d
    AMPLITUDE_ZONE: US
  configs:
    # Simulator builds in CI have no team and need no signature. Release
    # takes the team from the xcodebuild command line, and each app target
    # its profile below.
    Debug:
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGN_IDENTITY: ""
# Amplitude's library, pinned exactly, and the two it builds on, so the
# runner's fresh resolution builds the same code every time. Session Replay
# exists for iOS only: the iPhone and iPad app links it, the television's
# does not (docs/analytics.md).
packages:
  AmplitudeSwift:
    url: https://github.com/amplitude/Amplitude-Swift.git
    exactVersion: 1.20.0
  AmplitudeCore:
    url: https://github.com/amplitude/AmplitudeCore-Swift.git
    exactVersion: 1.6.1
  AnalyticsConnector:
    url: https://github.com/amplitude/analytics-connector-ios.git
    exactVersion: 1.3.3
  AmplitudeSessionReplay:
    url: https://github.com/amplitude/AmplitudeSessionReplay-iOS.git
    exactVersion: 0.18.1
targets:
  TVScores:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: AmplitudeSwift
        product: AmplitudeSwift
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: TV Scores
        CFBundleName: TV Scores
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, fr, pt, es]
        TVScoresProxyURL: https://tvscores.julienmalige.com
        # "store" for the build submitted to Apple (TestFlight workflow, store: true).
        TVScoresEdition: $(TVSCORES_EDITION)
        TVScoresAmplitudeKey: $(AMPLITUDE_KEY)
        TVScoresAmplitudeZone: $(AMPLITUDE_ZONE)
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julienmalige.tvscores
        # Runs as the Apple TV user in use: the name in Settings is per user.
        # The App ID has the User Management capability and the profile
        # carries it (docs/release.md).
        CODE_SIGN_ENTITLEMENTS: TVScores.entitlements
        TARGETED_DEVICE_FAMILY: "3"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        # Written into Info.plist as TVScoresEdition (Sources/Services/Edition.swift);
        # the TestFlight workflow passes TVSCORES_EDITION=store for the store build.
        TVSCORES_EDITION: tester
      configs:
        # The archive's signing, for the app alone: given on the xcodebuild
        # command line it would reach Amplitude's packages too, whose
        # resource bundles take no profile (docs/release.md).
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(TVSCORES_PROFILE)
  # The same app on an iPhone or an iPad (Julien, 2026-11-12): the same
  # sources, drawn at Apple's own sizes (`Metrics`) with a touch menu
  # (`SplitMenu`) in place of the remote's. The television's bundle id, so
  # the App Store sells the two as one app (universal purchase).
  TVScoresiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: ["Info.plist"]
      - path: Resources
        buildPhase: resources
        excludes: ["Assets.xcassets"] # the television's icon and Top Shelf
      - path: iOS
        excludes: ["Info.plist"]
    dependencies:
      - package: AmplitudeSwift
        product: AmplitudeSwift
      - package: AmplitudeSessionReplay
        product: AmplitudeSwiftSessionReplayPlugin
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: TV Scores
        CFBundleName: TV Scores
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, fr, pt, es]
        TVScoresProxyURL: https://tvscores.julienmalige.com
        TVScoresEdition: $(TVSCORES_EDITION)
        TVScoresAmplitudeKey: $(AMPLITUDE_KEY)
        TVScoresAmplitudeZone: $(AMPLITUDE_ZONE)
        # Dark, as Apple Sports: every page is drawn on a dark tint.
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julienmalige.tvscores
        PRODUCT_NAME: TVScores
        TARGETED_DEVICE_FAMILY: "1,2"
        # The iCloud key-value store, for My Teams; the App ID has the
        # iCloud capability and the profiles carry it (docs/release.md).
        CODE_SIGN_ENTITLEMENTS: TVScoresiOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TVSCORES_EDITION: tester
      configs:
        # Signed as the television's app is, for the app alone.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(TVSCORES_PROFILE)
  # Unit tests run inside the app, so they see its bundle — the sample JSON
  # and the string catalogue — and its internals through @testable.
  TVScoresTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: Tests/Unit
    dependencies:
      - target: TVScores
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.julienmalige.tvscores.tests
  # Flow tests drive the app from outside with the Siri Remote, one per screen.
  TVScoresFlows:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: Tests/Flows
    dependencies:
      - target: TVScores
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.julienmalige.tvscores.flows
schemes:
  TVScores:
    build:
      targets:
        TVScores: all
        TVScoresTests: [test]
        TVScoresFlows: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TVScoresTests
        - TVScoresFlows
  TVScoresiOS:
    build:
      targets:
        TVScoresiOS: all
    run:
      config: Debug
