name: TestFlight

# Manual only: archives a signed Release build — the Apple TV's, or with
# `platform: ios` the iPhone and iPad's (2026-11-12) — and uploads it to App
# Store Connect, with no Mac involved. Signing is manual: the distribution
# certificate and the App Store profile were created through the App Store
# Connect API and live in repository secrets. Xcode's cloud signing is not
# used because it needs an Admin API key, and ours is App Manager.
# See docs/release.md for how to mint a new certificate or profile.

on:
  workflow_dispatch:
    inputs:
      build:
        description: Build number (defaults to the workflow run number)
        required: false
        type: string
      store:
        description: Store build, the one to submit to Apple (no Debug section in Settings, no trace)
        required: false
        type: boolean
        default: false
      platform:
        description: The Apple TV's app (tvos) or the iPhone and iPad's (ios)
        required: false
        type: choice
        options: [tvos, ios]
        default: tvos

concurrency:
  group: testflight
  cancel-in-progress: false

# The job pushes one commit: the changelog section it just closed.
permissions:
  contents: write

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
      BUILD_NUMBER: ${{ inputs.build || github.run_number }}
      EDITION: ${{ inputs.store && 'store' || 'tester' }}
      PLATFORM: ${{ inputs.platform || 'tvos' }}
      SCHEME: ${{ inputs.platform == 'ios' && 'TVScoresiOS' || 'TVScores' }}
      DESTINATION: ${{ inputs.platform == 'ios' && 'generic/platform=iOS' || 'generic/platform=tvOS' }}
      PROFILE_NAME: ${{ inputs.platform == 'ios' && 'TV Scores iOS App Store' || 'TV Scores tvOS App Store 2' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the credentials are present
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          DIST_PROFILE_BASE64: ${{ secrets.DIST_PROFILE_BASE64 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_TEAM_ID ASC_KEY_P8 \
                      DIST_P12_BASE64 DIST_P12_PASSWORD DIST_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is not set on this repository"
              exit 1
            fi
          done

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version

      - name: Ensure a tvOS platform is installed
        if: env.PLATFORM == 'tvos'
        run: |
          if ! xcodebuild -showsdks | grep -q appletvos; then
            sudo xcodebuild -downloadPlatform tvOS
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_"$ASC_KEY_ID".p8
          chmod 600 ~/private_keys/AuthKey_"$ASC_KEY_ID".p8

      - name: Install the signing certificate and profile
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          DIST_PROFILE_BASE64: ${{ secrets.DIST_PROFILE_BASE64 }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # The iPhone's App Store profile (2026-11-12) is read from Apple by
          # its name, with the key this job already holds, rather than kept
          # as one more secret; the television's is the secret it always was.
          if [ "$PLATFORM" = ios ]; then
            profile=$(node ../scripts/asc.mjs get "/v1/profiles?filter[name]=TV%20Scores%20iOS%20App%20Store&filter[profileState]=ACTIVE&fields[profiles]=profileContent" \
              | jq -r '.data[0].attributes.profileContent // empty')
            test -n "$profile"
          else
            profile="$DIST_PROFILE_BASE64"
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass="$(openssl rand -hex 24)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          echo "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" \
            -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '\"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$keychain" | sed 's/[0-9A-F]\{40\}/HASH/'
          # Xcode 16 and later read the first path, older tooling the second.
          for dir in ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles \
                     ~/Library/MobileDevice/Provisioning\ Profiles; do
            mkdir -p "$dir"
            echo "$profile" | base64 --decode > "$dir/tvscores.mobileprovision"
          done

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project TVScores.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "$DESTINATION" \
            -archivePath "$RUNNER_TEMP/TVScores.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            TVSCORES_EDITION="$EDITION" \
            DEVELOPMENT_TEAM="$ASC_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/signing.keychain-db" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning:|Signing|ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"
          # The edition is what keeps the tester's tools out of the store build:
          # check it reached the archived Info.plist rather than trust the flag.
          app=$(ls -d "$RUNNER_TEMP"/TVScores.xcarchive/Products/Applications/*.app)
          edition=$(/usr/libexec/PlistBuddy -c "Print :TVScoresEdition" "$app/Info.plist")
          echo "edition: $edition"
          test "$edition" = "$EDITION"

      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$ASC_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.julienmalige.tvscores</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TVScores.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath ~/private_keys/AuthKey_"$ASC_KEY_ID".p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log" | grep -E "error:|Upload|EXPORT" || true
          grep -q "EXPORT SUCCEEDED" "$RUNNER_TEMP/export.log"

      # A tester who opens TestFlight should see what changed, not just a number.
      - name: Send the release note and hand the build to the testers
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node ../scripts/testflight.mjs "$BUILD_NUMBER"

      # closeSection rewrites CHANGELOG.md on the runner; without this the
      # heading it just wrote is thrown away with the runner, and the next
      # release sends the same notes again under a new build number.
      - name: Commit the closed changelog section
        run: |
          cd "$GITHUB_WORKSPACE"
          git diff --quiet -- CHANGELOG.md && echo "nothing to close" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Close the changelog for build $BUILD_NUMBER"
          git push

      - name: Remove the key and the keychain
        if: always()
        run: |
          rm -f ~/private_keys/AuthKey_*.p8
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # Only on failure, and redacted first: GitHub masks secrets in the
      # console but not inside uploaded files, and xcodebuild prints the team
      # id in the signing identity and the key id in the key path.
      - name: Redact the logs
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/archive.log "$RUNNER_TEMP"/export.log; do
            [ -f "$f" ] || continue
            sed -i '' -e "s/$ASC_TEAM_ID/TEAMID/g" -e "s/$ASC_KEY_ID/KEYID/g" \
              -e "s/$ASC_ISSUER_ID/ISSUERID/g" "$f"
          done

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
