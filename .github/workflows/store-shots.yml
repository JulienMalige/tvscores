name: Store screenshots

# The App Store's pictures (docs/store-listing.md): the same six screens in
# each store language, on live data, with that storefront's clock and
# channels. Run it by hand when the board is busy, a weekend afternoon in
# Europe, rather than on every push: the screens show whatever is on.
# scripts/store-shots.mjs then sends the artifact to App Store Connect.
on:
  workflow_dispatch:

jobs:
  shots:
    name: Store screenshots on live data
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Ensure a tvOS simulator runtime exists
        run: |
          if ! xcrun simctl list runtimes | grep -q tvOS; then
            sudo xcodebuild -downloadPlatform tvOS
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # As the store build: no Debug section, and no trace sent from the runner.
      - name: Build for tvOS simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project TVScores.xcodeproj \
            -scheme TVScores \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            TVSCORES_EDITION=store \
            build 2>&1 | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Take the screenshots
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries[] | select(.key | test("tvOS")) | .value[] | select(.name | test("^Apple TV( 4K)?")) | .udid' \
            | head -1)
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/Build/Products -name 'TVScores.app' -maxdepth 2 | head -1)
          xcrun simctl install "$UDID" "$APP"
          # A storefront: its language, its clock, its country's channels, the
          # game to show where to watch, the finished game, and the competition
          # it opens. Games are named best first (Sidebar.openRequestedGame):
          # what is on decides which one opens. Spain has no channel list of
          # its own; the US one carries the Spanish-language channels.
          for spec in \
            "fr-FR fr fr_FR Europe/Paris FR scheduled:football:4334:tv|scheduled:football:tv final:football:4334|final:football:4328|final:football 4334" \
            "en-US en en_US America/New_York US scheduled:nfl:tv|live:nfl:tv|scheduled:football:tv final:football:4328|final:football nfl" \
            "pt-BR pt-BR pt_BR America/Sao_Paulo BR scheduled:football:4351:tv|scheduled:football:tv final:football:4351|final:football 4351" \
            "es-ES es es_ES Europe/Madrid US scheduled:football:4335:tv|scheduled:football:tv final:football:4335|final:football 4335"; do
            read -r store lang locale zone countries watch final league <<< "$spec"
            mkdir -p "store/$store"
            shot() { # $1 file name, then the app's arguments
              local name=$1
              shift
              xcrun simctl terminate "$UDID" com.julienmalige.tvscores 2>/dev/null || true
              SIMCTL_CHILD_TZ="$zone" xcrun simctl launch "$UDID" com.julienmalige.tvscores "$@" \
                -AppleLanguages "($lang)" -AppleLocale "$locale" -channelCountries "($countries)" > /dev/null
              sleep 18
              xcrun simctl io "$UDID" screenshot "store/$store/$name.png" > /dev/null
            }
            shot 1-today -TVScoresTab today
            shot 2-watch -TVScoresTab today -TVScoresGame "$watch"
            shot 3-game -TVScoresTab today -TVScoresGame "$final"
            # The weekend with a result if the board still holds it, else the next.
            shot 4-race -TVScoresTab today -TVScoresRace "f1|f1:next"
            # Its games to come above its table, rather than an empty today.
            shot 5-league -TVScoresTab upcoming -TVScoresLeague "$league"
            shot 6-menu -TVScoresTab today -TVScoresMenuOpen
          done
          ls -R store

      - uses: actions/upload-artifact@v4
        with:
          name: store-shots
          path: app/store
