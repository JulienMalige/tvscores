name: tvOS build

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/tvos.yml"]
  workflow_dispatch:

concurrency:
  group: tvos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, run in simulator, screenshot
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes | grep -i tvos || echo "no tvOS runtime yet"

      - name: Ensure a tvOS simulator runtime exists
        run: |
          if ! xcrun simctl list runtimes | grep -q tvOS; then
            sudo xcodebuild -downloadPlatform tvOS
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for tvOS simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project TVScores.xcodeproj \
            -scheme TVScores \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      # The model and the elements first, in seconds and without a screen;
      # then the flows, driven by the remote on the same simulator the
      # screenshots use. A failing flow leaves its own screenshots behind.
      - name: Run the tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries[] | select(.key | test("tvOS")) | .value[] | select(.name | test("^Apple TV( 4K)?")) | .udid' \
            | head -1)
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          SIMCTL_CHILD_TZ=America/Sao_Paulo xcodebuild \
            -project TVScores.xcodeproj \
            -scheme TVScores \
            -destination "id=$UDID" \
            -derivedDataPath build \
            -resultBundlePath tests.xcresult \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log | grep -E "error:|Test Suite|Test Case|passed|failed|BUILD|\*\* TEST|^TREE\|" || true
          grep -qE "TEST SUCCEEDED" test.log

      # A flow that loses its app has caught a crash. Keep the report before
      # the screenshot step clears the folder for its own launch.
      - name: Keep any crash the tests caused
        if: always()
        run: |
          mkdir -p test-crashes
          cp ~/Library/Logs/DiagnosticReports/TVScores*.ips test-crashes/ 2>/dev/null && ls test-crashes || echo "no crash report from the tests"

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/test.log
            app/test-crashes
          if-no-files-found: ignore

      # Even after a failing test: the pictures are the evidence a failure
      # needs, and the job is red either way.
      - name: Run in simulator and take screenshots
        if: success() || failure()
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries[] | select(.key | test("tvOS")) | .value[] | select(.name | test("^Apple TV( 4K)?")) | .udid' \
            | head -1)
          echo "Using simulator $UDID"
          # The test step has usually booted it already; booting a booted
          # device is an error, and under `set -e` it took the screenshots
          # with it — which is why a failing run left no pictures behind.
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/Build/Products -name 'TVScores.app' -maxdepth 2 | head -1)
          echo "App bundle: $APP"
          mkdir -p shots
          xcrun simctl install "$UDID" "$APP"
          shot() { # $1 lang, $2 tab, $3 optional league sport (opens the league page)
            xcrun simctl terminate "$UDID" com.julienmalige.tvscores 2>/dev/null || true
            # Demo sample is bucketed in São Paulo time (see app/README note); run the simulator in the same zone.
            SIMCTL_CHILD_TZ=America/Sao_Paulo xcrun simctl launch "$UDID" com.julienmalige.tvscores -TVScoresDemo -TVScoresTab "$2" ${3:+-TVScoresLeague "$3"} -AppleLanguages "($1)" -AppleLocale "$1"
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/${3:+league-$3-}$2-$1.png"
          }
          race() { # $1 lang, $2 series: opens that series' race result page
            xcrun simctl terminate "$UDID" com.julienmalige.tvscores 2>/dev/null || true
            SIMCTL_CHILD_TZ=America/Sao_Paulo xcrun simctl launch "$UDID" com.julienmalige.tvscores -TVScoresDemo -TVScoresSample race -TVScoresTab yesterday -TVScoresRace "$2" -AppleLanguages "($1)" -AppleLocale "$1"
            sleep 8
            xcrun simctl io "$UDID" screenshot "shots/race-$2-$1.png"
          }
          for lang in en fr pt es; do shot "$lang" today; done
          shot en yesterday
          shot en upcoming
          shot en today f1
          shot en today nfl
          shot en today nba
          shot en today 4480
          shot en upcoming tennis
          shot en yesterday football
          xcrun simctl terminate "$UDID" com.julienmalige.tvscores 2>/dev/null || true
          SIMCTL_CHILD_TZ=America/Sao_Paulo xcrun simctl launch "$UDID" com.julienmalige.tvscores -TVScoresDemo -TVScoresTab today -TVScoresLeague f1 -TVScoresTable constructors -AppleLanguages "(en)"
          sleep 8
          xcrun simctl io "$UDID" screenshot shots/constructors-en.png
          # The same page for MotoGP, to judge the two against each other.
          for table in riders teams; do
            xcrun simctl terminate "$UDID" com.julienmalige.tvscores 2>/dev/null || true
            SIMCTL_CHILD_TZ=America/Sao_Paulo xcrun simctl launch "$UDID" com.julienmalige.tvscores -TVScoresDemo -TVScoresTab today -TVScoresLeague motogp -TVScoresTable "$table" -AppleLanguages "(en)"
            sleep 8
            xcrun simctl io "$UDID" screenshot "shots/motogp-$table-en.png"
          done
          race en f1
          race en motogp
          race fr f1
          ls -la shots

          # The demo runs above never touch the network. Launch once against the
          # real proxy, which is the code path a TestFlight build actually takes,
          # and keep any crash report the simulator writes.
          xcrun simctl terminate "$UDID" com.julienmalige.tvscores 2>/dev/null || true
          rm -f ~/Library/Logs/DiagnosticReports/TVScores*.ips
          SIMCTL_CHILD_TZ=America/Sao_Paulo xcrun simctl launch "$UDID" com.julienmalige.tvscores -AppleLanguages "(en)"
          sleep 20
          xcrun simctl io "$UDID" screenshot shots/live-today-en.png
          # Yesterday carries the NFL section, which is where the league badge
          # and the densest list are; check both against the real feed.
          xcrun simctl terminate "$UDID" com.julienmalige.tvscores 2>/dev/null || true
          SIMCTL_CHILD_TZ=America/Sao_Paulo xcrun simctl launch "$UDID" com.julienmalige.tvscores -TVScoresTab yesterday -AppleLanguages "(en)"
          sleep 20
          xcrun simctl io "$UDID" screenshot shots/live-yesterday-en.png
          xcrun simctl terminate "$UDID" com.julienmalige.tvscores 2>/dev/null || true
          SIMCTL_CHILD_TZ=America/Sao_Paulo xcrun simctl launch "$UDID" com.julienmalige.tvscores -TVScoresTab yesterday -TVScoresLeague nfl -AppleLanguages "(en)"
          sleep 20
          xcrun simctl io "$UDID" screenshot shots/live-league-nfl-en.png
          if xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q com.julienmalige.tvscores; then
            echo "live run: still running"
          else
            echo "::warning::the app is no longer running after the live launch"
          fi
          mkdir -p crash
          cp ~/Library/Logs/DiagnosticReports/TVScores*.ips crash/ 2>/dev/null || echo "no crash report"
          ls -la crash || true
          # Every picture the app failed to load during these launches, with
          # the reason — the only witness to a crest missing from a screenshot.
          xcrun simctl spawn "$UDID" log show --last 15m --style compact \
            --predicate 'subsystem == "com.julienmalige.tvscores"' > shots/images.log 2>/dev/null || true
          echo "image failures: $(grep -c 'attempt\|gave up' shots/images.log || true)"
          grep -E 'attempt|gave up' shots/images.log | sed 's/^/IMG| /' | head -40 || true

      - name: Upload crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports
          path: app/crash/*
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/shots/*.png
          if-no-files-found: warn

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: app/build.log
